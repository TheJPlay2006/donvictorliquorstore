<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías | Panel Admin · Don Víctor</title>
    <link rel="icon" type="image/png" href="img/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-body" style="visibility:hidden">
    <header class="admin-topbar">
        <div class="admin-topbar-marca">
            <img src="img/logo.png" alt="Licores Don Víctor">
            <span>Panel Admin</span>
        </div>

        <nav class="admin-topbar-nav" aria-label="Navegación admin">
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="categorias.html" class="active">Categorías</a>
        </nav>

        <div class="admin-topbar-usuario">
            <span id="adminNombreUsuario"></span>
            <a href="https://donvictorliquorstore.vercel.app/" class="admin-topbar-ver-sitio" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
                Ver sitio
            </a>
            <button id="adminCerrarSesion" type="button" class="admin-boton-secundario">
                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                Cerrar sesión
            </button>
        </div>
    </header>

    <main class="admin-contenido">
        <div class="admin-encabezado-lista">
            <h1>Categorías</h1>
            <button type="button" id="adminNuevaCategoria" class="admin-boton-primario">
                <i class="fa-solid fa-plus" aria-hidden="true"></i>
                Nueva categoría
            </button>
        </div>

        <section id="panelFormCategoria" class="admin-panel-inline" hidden>
            <h2 id="tituloFormCategoria" class="admin-panel-titulo">Nueva categoría</h2>

            <form id="formularioCategoria" class="consulta-form admin-form" novalidate>
                <label for="categoriaNombre">Nombre <span aria-hidden="true">*</span></label>
                <input id="categoriaNombre" name="nombre" type="text" required maxlength="100">

                <label for="categoriaDescripcion">Descripción</label>
                <textarea id="categoriaDescripcion" name="descripcion" rows="3"></textarea>

                <label for="categoriaImagenArchivo">Imagen</label>
                <div class="admin-campo-imagen">
                    <img id="previewImagenCategoria" class="admin-campo-imagen-preview" alt="" hidden>

                    <div class="admin-campo-imagen-controles">
                        <input id="categoriaImagenArchivo" class="admin-input-file-oculto" type="file" accept="image/jpeg,image/png,image/webp">
                        <label for="categoriaImagenArchivo" class="admin-boton-secundario">
                            <i class="fa-solid fa-upload" aria-hidden="true"></i>
                            Elegir imagen
                        </label>
                        <span id="imagenActualTextoCategoria" class="admin-archivo-nombre">Sin imagen todavía.</span>
                    </div>
                </div>
                <p class="admin-ayuda">JPEG, PNG o WebP, máx. 8 MB.</p>

                <div class="admin-form-checks">
                    <label class="admin-check"><input type="checkbox" name="mostrar_inicio"><span>Mostrar en inicio</span></label>
                    <label class="admin-check"><input type="checkbox" name="estado" checked><span>Activa</span></label>
                </div>

                <div class="admin-form-acciones">
                    <button type="submit" id="botonGuardarCategoria">
                        <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                        Guardar
                    </button>
                    <button type="button" id="botonCancelarCategoria" class="admin-boton-secundario">Cancelar</button>
                </div>

                <p id="categoriaFeedback" class="consulta-feedback" aria-live="polite"></p>
            </form>
        </section>

        <div id="adminListaCategorias" class="admin-lista"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config/supabase-client.js"></script>
    <script src="js/admin/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin/admin-chrome.js"></script>
    <script src="js/admin/storage.js"></script>
    <script src="js/admin/categorias.js"></script>
</body>

</html>

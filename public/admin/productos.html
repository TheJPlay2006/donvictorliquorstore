<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | Panel Admin · Don Víctor</title>
    <link rel="icon" type="image/png" href="img/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-body" style="visibility:hidden">
    <header class="admin-topbar">
        <div class="admin-topbar-marca">
            <img src="img/logo.png" alt="Licores Don Víctor">
            <span>Panel Admin</span>
        </div>

        <nav class="admin-topbar-nav" aria-label="Navegación admin">
            <a href="index.html">Inicio</a>
            <a href="productos.html" class="active">Productos</a>
            <a href="categorias.html">Categorías</a>
        </nav>

        <div class="admin-topbar-usuario">
            <span id="adminNombreUsuario"></span>
            <a href="https://donvictorliquorstore.vercel.app/" class="admin-topbar-ver-sitio" target="_blank" rel="noopener noreferrer">
                <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
                Ver sitio
            </a>
            <button id="adminCerrarSesion" type="button" class="admin-boton-secundario">
                <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                Cerrar sesión
            </button>
        </div>
    </header>

    <main class="admin-contenido">
        <div class="admin-encabezado-lista">
            <h1>Productos</h1>
            <div class="admin-encabezado-acciones">
                <a href="productos-importar.html" class="admin-boton-secundario">
                    <i class="fa-solid fa-file-import" aria-hidden="true"></i>
                    Importar productos
                </a>
                <a href="producto-form.html" class="admin-boton-primario">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    Nuevo producto
                </a>
            </div>
        </div>

        <div class="admin-controles-lista">
            <input id="adminBuscarProducto" type="search" placeholder="Buscar por nombre o marca..." aria-label="Buscar producto">

            <select id="adminFiltroCategoria" aria-label="Filtrar por categoría">
                <option value="todas">Todas las categorías</option>
            </select>
        </div>

        <p id="adminProductosCantidad" class="admin-cantidad-resultados"></p>

        <div id="adminListaProductos" class="admin-lista"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config/supabase-client.js"></script>
    <script src="js/admin/auth-guard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin/admin-chrome.js"></script>
    <script src="js/admin/productos.js"></script>
</body>

</html>

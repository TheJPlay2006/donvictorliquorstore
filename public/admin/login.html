<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Panel Admin · Don Víctor</title>
    <link rel="icon" type="image/png" href="img/favicon.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-body admin-body-login">
    <main class="admin-login-pantalla">
        <section class="admin-login-tarjeta">
            <img class="admin-login-logo" src="img/logo.png" alt="Licores Don Víctor">
            <h1>Panel administrativo</h1>
            <p class="admin-login-subtitulo">Ingresá con tu cuenta de administrador.</p>

            <form id="formularioLogin" class="consulta-form admin-form" novalidate>
                <label for="loginEmail">Correo electrónico <span aria-hidden="true">*</span></label>
                <input id="loginEmail" name="email" type="email" autocomplete="username" required>

                <label for="loginPassword">Contraseña <span aria-hidden="true">*</span></label>
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>

                <button type="submit" id="botonLogin">
                    <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                    Iniciar sesión
                </button>

                <p id="loginFeedback" class="consulta-feedback admin-login-error" aria-live="polite"></p>
            </form>

            <a class="admin-login-volver" href="https://donvictorliquorstore.vercel.app/">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                Volver al sitio
            </a>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config/supabase-client.js"></script>
    <script src="js/admin/login.js"></script>
</body>

</html>

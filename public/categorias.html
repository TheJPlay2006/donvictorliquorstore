<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="categorias.metaTitulo">Categorías | Licores Don Víctor</title>
    <link rel="icon" type="image/png" href="img/favicon.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Header reutilizable -->
    <div id="header-container"></div>


    <!-- Contenido de Categorías -->
    <main id="mainContent">

        <section class="encabezado-categorias-pagina">

            <div class="contenedor-categorias-pagina">

                <nav class="migas-pan" aria-label="Ruta de navegación">

                    <a href="index.html" data-i18n="common.inicio">Inicio</a>
                    <span>/</span>

                    <a href="categorias.html" id="enlaceTodasCategorias" data-i18n="categorias.breadcrumb">
                        Categorías
                    </a>
                </nav>

                <h1 id="tituloCategorias" data-i18n="categorias.titulo">
                    Todas las categorías
                </h1>

                <p id="subtituloCategorias" data-i18n="categorias.subtitulo">
                    Explorá nuestra variedad por tipo de producto
                </p>

            </div>

        </section>

        <section class="listado-categorias-pagina">

            <div class="contenedor-categorias-pagina">

                <div id="categoriasPaginaGrid" class="categorias-pagina-grid">
                    <p class="mensaje-carga" data-i18n="producto.cargandoCategorias">
                        Cargando categorías...
                    </p>
                </div>

            </div>

        </section>

    </main>

    <!-- WhatsApp flotante -->
    <a href="https://wa.me/50672497807" target="_blank" rel="noopener noreferrer" class="whatsapp-flotante"
        aria-label="Consultar por WhatsApp" data-i18n-aria="catalogo.whatsappFlotanteAria">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Footer reutilizable -->
    <div id="footer-container"></div>

    <!-- Modal de producto -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="tituloModalProducto" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h2
                    class="modal-title"
                    id="tituloModalProducto"
                    data-i18n="catalogo.modalDetalleTitulo"
                    >
                        Detalle del producto
                    </h2>

                    <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Cerrar"
                    data-i18n-aria="catalogo.modalCerrarAria"
                    ></button>
                </div>

                <div class="modal-body">
                    <p data-i18n="catalogo.modalPlaceholder">
                        Aquí aparecerá la información del producto.
                    </p>
                </div>
            </div>

        </div>
    </div>

    <!-- Componentes compartidos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config/supabase-client.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/componentes.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

     <script src="js/modal-producto.js"></script>

    <script src="js/categorias.js"></script>



</body>

</html>

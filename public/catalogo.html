<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | Licores Don Víctor</title>
    <link rel="icon" type="image/png" href="img/favicon.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Header reutilizable -->
    <div id="header-container"></div>

    <main id="mainContent">

        <!-- Encabezado -->
        <section class="encabezado-catalogo">

            <div class="contenedor-catalogo">

                <nav class="migas-pan" aria-label="Ruta de navegación">
                    <a href="index.html">Inicio</a>
                    <span>/</span>
                    <span>Catálogo</span>
                </nav>

                <h1>Catálogo de productos</h1>

                <p>
                    Explorá nuestra selección completa de bebidas
                    y accesorios
                </p>

            </div>

        </section>

        <!-- Contenido -->
        <section class="contenido-catalogo">

            <div class="contenedor-catalogo">

                <!-- Buscador -->
                <div class="buscador-catalogo">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="search" id="buscarProducto" name="buscarProducto"
                        placeholder="Buscar por nombre, marca o código" aria-label="Buscar productos"
                        autocomplete="off">

                </div>

                <div class="catalogo-layout">

                    <!-- Filtros -->
                    <aside class="filtros-catalogo">

                        <h2>Filtros</h2>

                        <div class="grupo-filtros">

                            <h3>Categoría</h3>

                            <div id="filtrosCategorias" class="opciones-filtro">
                                <button type="button" class="opcion-filtro active" data-categoria="todas">
                                    <span>Todas las categorías</span>
                                </button>

                                <p class="mensaje-carga">
                                    Cargando categorías...
                                </p>
                            </div>

                        </div>

                        <div class="grupo-filtros">

                            <h3>Disponibilidad</h3>

                            <div class="opciones-filtro">

                                <button type="button" class="opcion-filtro active" data-disponibilidad="todas">
                                    Todas
                                </button>

                                <button type="button" class="opcion-filtro" data-disponibilidad="disponible">
                                    Disponibles
                                </button>

                                <button type="button" class="opcion-filtro" data-disponibilidad="agotado">
                                    Agotado
                                </button>

                                <button type="button" class="opcion-filtro" data-disponibilidad="consultar">
                                    Consultar
                                </button>

                            </div>

                        </div>

                    </aside>

                    <!-- Resultados -->
                    <section class="resultados-catalogo">

                        <div class="barra-resultados">

                            <p id="cantidadProductos">
                                Cargando productos...
                            </p>

                            <div class="controles-resultados">

                                <select id="ordenarProductos" name="ordenarProductos" aria-label="Ordenar productos">
                                    <option value="nombre-asc">
                                        Nombre: A-Z
                                    </option>

                                    <option value="nombre-desc">
                                        Nombre: Z-A
                                    </option>

                                    <option value="precio-asc">
                                        Precio: menor a mayor
                                    </option>

                                    <option value="precio-desc">
                                        Precio: mayor a menor
                                    </option>
                                </select>

                                <div class="botones-vista">

                                    <button type="button" class="boton-vista active" data-vista="cuadricula"
                                        aria-label="Vista en cuadrícula">
                                        <i class="fa-solid fa-table-cells-large"></i>
                                    </button>

                                    <button type="button" class="boton-vista" data-vista="lista"
                                        aria-label="Vista en lista">
                                        <i class="fa-solid fa-list"></i>
                                    </button>

                                </div>

                            </div>

                        </div>

                        <div id="productosCatalogo" class="productos-catalogo-grid">
                            <p class="mensaje-carga">
                                Cargando productos...
                            </p>
                        </div>

                    </section>

                </div>

            </div>

        </section>

    </main>
    <!-- WhatsApp flotante -->

    <a href="https://wa.me/50672497807" target="_blank" rel="noopener noreferrer" class="whatsapp-flotante"
        aria-label="Consultar por WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Modal de producto -->
    <div class="modal fade" id="modalProducto" tabindex="-1" aria-labelledby="tituloModalProducto" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config/supabase-client.js"></script>
    <script src="js/componentes.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="js/modal-producto.js"></script>

    <script src="js/catalogo.js"></script>



</body>

</html>
